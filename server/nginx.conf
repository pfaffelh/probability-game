# nginx without root, for the server: the site and Lean at /lean/, on port 8080, behind the
# institute's reverse proxy (which does HTTPS). Paths are relative to the prefix ~/lean/nginx
# (`nginx -p ~/lean/nginx -c …`), where server/deploy.sh links the built site as `site`.
worker_processes 2;
pid nginx.pid;
daemon off;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path tmp/body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    # the visitor's address, from the reverse proxy
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 132.230.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Lean per visitor: a few requests a second, with room for a proof checked line by line
    limit_req_zone $binary_remote_addr zone=lean:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 8080;
        root site;

        location /lean/ {
            limit_req zone=lean burst=40 nodelay;
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:8091/;
            proxy_read_timeout 120s;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
